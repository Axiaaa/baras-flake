name: Get latest release version
permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch
  # schedule:
  #   - cron:  '0 0 * * *'
  #
jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch release version
        run: |
          curl -sL https://api.github.com/repos/Axiaaa/baras/releases/latest | jq '.tag_name as $tag
                | .assets[]
                | select(.name | endswith("AppImage"))
                | {version: $tag, name, sha256: (.digest | sub("^sha256:"; ""))}' > latest.json

      - name: Check for modified files
        id: git-check
        run: |
          if [ $(git status --porcelain | wc -l) -gt 0 ]; then
            exit 1;
          fi
          exit 0
        continue-on-error: true

      - name: Read release info
        id: release
        run: |
          echo "version=$(jq -rs '.[0].version' latest.json)"  >> "$GITHUB_OUTPUT"
          echo "name=$(jq -rs '.[0].name' latest.json)"     >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -rs '.[0].sha256' latest.json)"    >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.git-check.outcome == 'failure'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: |
            New baras update dropped: ${{ steps.release.outputs.version }}

            ${{ steps.release.outputs.name }}
            sha256: ${{ steps.release.outputs.sha }}
          title: "New Baras version ${{ steps.release.outputs.version }}"
          body: Update the flake!
          branch: baras-${{ steps.release.outputs.version }}
          base: main
